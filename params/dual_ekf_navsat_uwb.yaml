ekf_filter_node_fused:
  ros__parameters:
    frequency: 12.0
    sensor_timeout: 0.3
    two_d_mode: true

    print_diagnostics: true
    debug: false

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /irrigation/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    #imu0: /imu/data
    #imu0_config: [false, false, false,
    #              false, false, true,
    #              false, false, false,
    #              false, false, true,
    #              false, false, false]
    #imu0_queue_size: 10
    #imu0_nodelay: true
    #imu0_differential: false
    #imu0_relative: false
    #imu0_remove_gravitational_acceleration: true

    use_control: false


ekf_filter_node_map:
  ros__parameters:
    frequency: 5.0
    sensor_timeout: 1.0
    two_d_mode: true

    print_diagnostics: true
    debug: false

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /odometry/gps_map
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: true
    odom0_pose_rejection_threshold: 5.0

    odom1: /irrigation/odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: false
    odom1_differential: false
    odom1_relative: false
    odom1_twist_rejection_threshold: 2.0

    #imu0: /imu/data
    #imu0_config: [false, false, false,
    #              false, false, true,
    #              false, false, false,
    #              false, false, false,
    #              false, false, false]
    #imu0_queue_size: 10
    #imu0_nodelay: false
    #imu0_differential: false
    #imu0_relative: false
    #imu0_remove_gravitational_acceleration: true

    use_control: false
